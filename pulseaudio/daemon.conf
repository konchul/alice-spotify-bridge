# Low-latency bit-perfect audio daemon configuration for Alice Lossless Bridge

# Prevent audio degradation from resampling
avoid-resampling = yes
resample-method = speex-float-5

# Native CD quality sample parameters (bit-perfect with Spotify and AirPlay)
default-sample-format = s16le
default-sample-rate = 44100
default-sample-channels = 2
default-channel-map = front-left,front-right

# Ultra-low-latency 10ms buffer fragments (eliminates audio lag)
default-fragments = 8
default-fragment-size-msec = 10
deferred-volume-safety-margin-usec = 8000
